<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520">
  <style>text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}</style>
  <defs>
    <symbol id="tee" viewBox="0 0 40 40"><path d="M13 5 L3 11 L7 19 L12 17 L12 36 L28 36 L28 17 L33 19 L37 11 L27 5 Q20 10 13 5 Z"/></symbol>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#F08A5D"/>
  <circle cx="90" cy="80" r="32" fill="#FFE08A"/>
  <g fill="#F4A47F">
    <rect x="0" y="370" width="90" height="150"/><rect x="250" y="400" width="80" height="120"/>
    <rect x="530" y="360" width="60" height="160"/><rect x="820" y="390" width="70" height="130"/>
  </g>
  <rect y="470" width="1200" height="50" fill="#DB7448"/>
  <text x="1160" y="72" text-anchor="end" font-size="46" font-weight="800" fill="#fff">FASHION RECOMMENDER</text>
  <text x="1160" y="106" text-anchor="end" font-size="19" font-weight="600" letter-spacing="3" fill="#fff">FROM POPULAR TO PERSONAL</text>

  <!-- customer -->
  <circle cx="110" cy="250" r="34" fill="#FFCFA3"/><path d="M58 338 a52 48 0 0 1 104 0z" fill="#2E3A59"/>
  <text x="110" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Customer #48213</text>
  <text x="110" y="394" text-anchor="middle" font-size="13" fill="#fff">bought: denim jacket</text>

  <!-- stage 1 -->
  <rect x="200" y="170" width="270" height="270" rx="20" fill="#fff"/>
  <text x="222" y="206" font-size="15" font-weight="800" fill="#DB7448">01 · BASELINE</text>
  <text x="222" y="232" font-size="17" font-weight="700" fill="#1E2A38">What everyone buys</text>
  <g fill="#C8CDD6">
    <use href="#tee" xlink:href="#tee" x="222" y="260" width="64" height="64"/>
    <use href="#tee" xlink:href="#tee" x="303" y="260" width="64" height="64"/>
    <use href="#tee" xlink:href="#tee" x="384" y="260" width="64" height="64"/>
  </g>
  <text x="222" y="370" font-size="14" fill="#6B7785">Popularity, last 7 days</text>
  <text x="222" y="410" font-size="14" font-weight="700" fill="#6B7785">Beat this first.</text>

  <!-- stage 2 -->
  <rect x="500" y="170" width="270" height="270" rx="20" fill="#fff"/>
  <text x="522" y="206" font-size="15" font-weight="800" fill="#DB7448">02 · COLLAB FILTERING</text>
  <text x="522" y="232" font-size="17" font-weight="700" fill="#1E2A38">Similar customers bought</text>
  <g fill="#2E3A59"><circle cx="545" cy="275" r="14"/><circle cx="585" cy="275" r="14"/><circle cx="625" cy="275" r="14"/></g>
  <g fill="#FFCFA3"><circle cx="545" cy="275" r="9"/><circle cx="585" cy="275" r="9"/><circle cx="625" cy="275" r="9"/></g>
  <g>
    <use href="#tee" xlink:href="#tee" x="522" y="305" width="56" height="56" fill="#5B6CF0"/>
    <use href="#tee" xlink:href="#tee" x="592" y="305" width="56" height="56" fill="#2BB3A8"/>
    <use href="#tee" xlink:href="#tee" x="662" y="305" width="56" height="56" fill="#C8CDD6"/>
  </g>
  <text x="522" y="410" font-size="14" fill="#6B7785">ALS / item-item similarity</text>

  <!-- stage 3 -->
  <rect x="800" y="150" width="350" height="300" rx="20" fill="#fff" stroke="#1E2A38" stroke-width="4"/>
  <text x="822" y="186" font-size="15" font-weight="800" fill="#DB7448">03 · RANKED FOR YOU</text>
  <text x="822" y="212" font-size="17" font-weight="700" fill="#1E2A38">Top 12, personalized</text>
  <g>
    <rect x="822" y="232" width="92" height="80" rx="10" fill="#FFF1EA"/><use href="#tee" xlink:href="#tee" x="842" y="240" width="52" height="52" fill="#2E3A59"/>
    <rect x="924" y="232" width="92" height="80" rx="10" fill="#FFF1EA"/><use href="#tee" xlink:href="#tee" x="944" y="240" width="52" height="52" fill="#5B6CF0"/>
    <rect x="1026" y="232" width="92" height="80" rx="10" fill="#FFF1EA"/><use href="#tee" xlink:href="#tee" x="1046" y="240" width="52" height="52" fill="#2BB3A8"/>
  </g>
  <g font-size="13" font-weight="800" fill="#DB7448"><text x="830" y="306">#1</text><text x="932" y="306">#2</text><text x="1034" y="306">#3</text></g>
  <rect x="822" y="330" width="296" height="40" rx="10" fill="#FFF1EA"/>
  <text x="836" y="356" font-size="15" fill="#1E2A38">Why: you bought a denim jacket</text>
  <text x="822" y="402" font-size="14" font-weight="700" fill="#6B7785">Metric: MAP@12, not accuracy</text>
  <text x="822" y="426" font-size="14" fill="#6B7785">Served via FastAPI /recommend</text>

  <g stroke="#1E2A38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M168 300 L192 300"/><path d="M470 300 L494 300"/><path d="M770 300 L794 300"/>
  </g>

  <text x="40" y="503" font-size="16" font-weight="600" fill="#fff" opacity="0.85">@codewithboi</text>
</svg>
