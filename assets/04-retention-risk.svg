<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <style>text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}</style>
  <rect width="1200" height="520" rx="24" fill="#3E8EDE"/>
